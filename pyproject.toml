[project]
package-mode = false
name = "guard-patrol-anomaly-detection"
version = "1.1.0"
description = "Anomaly detection for guard patrol and check-in data"
authors = [
    {name = "Zarmeen"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<2.10.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "apscheduler (>=3.10.4,<4.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app" }
]